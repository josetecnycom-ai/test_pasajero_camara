<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Control de Eventos de Cámara y Pasajeros</title>
</head>
<body style="margin:0;padding:0;background:transparent;">
<style>
  #gt-addin {
    --ink: #1e293b;
    --ink-light: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --surface: #f8fafc;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: var(--ink);
    padding: 20px;
    max-width: 1200px;
  }
  #gt-addin * { box-sizing: border-box; }
  
  .gt-header { margin-bottom: 20px; }
  .gt-header h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
  .gt-header p { margin: 0; color: var(--ink-light); font-size: 12px; }

  .gt-filter-bar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    background: #ffffff; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .gt-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
  .gt-field label { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.5px; }
  .gt-field select, .gt-field input {
    height: 36px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px; font-size: 13px; outline: none; background: #fff;
  }
  
  .gt-btn {
    height: 36px; padding: 0 20px; border-radius: 6px; border: none;
    background: var(--accent); color: #ffffff; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .gt-btn:hover { background: var(--accent-hover); }
  .gt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .gt-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .gt-card { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .gt-card .lbl { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; }
  .gt-card .val { font-size: 22px; font-weight: 700; margin-top: 4px; }

  .gt-table-container { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
  th { background: var(--surface); font-weight: 600; color: var(--ink-light); text-transform: uppercase; font-size: 10px; }
  
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .pill-ok { background: var(--ok-bg); color: var(--ok); }
  .pill-danger { background: var(--danger-bg); color: var(--danger); }
  
  .gt-empty { padding: 40px; text-align: center; color: var(--ink-light); }
  .gt-log { margin-top: 20px; padding: 12px; background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 11px; border-radius: 6px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
</style>

<div id="gt-addin">
  <div class="gt-header">
    <h1>Informe de Eventos de Cámara (CameraEvent API)</h1>
    <p>Consulta directa de detección de pasajeros y eventos de IA visual</p>
  </div>

  <div class="gt-filter-bar">
    <div class="gt-field">
      <label>Vehículo</label>
      <select id="selDevice"><option value="">Cargando vehículos…</option></select>
    </div>
    <div class="gt-field">
      <label>Tipo de Evento</label>
      <select id="selEventType">
        <option value="ALL">-- Todos los eventos de cámara --</option>
        <option value="Passenger.Disallowed" selected>🚫 Passenger.Disallowed (Pasajero no permitido)</option>
        <option value="Speed.Sign.Detected">🛑 Speed.Sign.Detected</option>
      </select>
    </div>
    <div class="gt-field">
      <label>Desde</label>
      <input type="date" id="inpFrom"/>
    </div>
    <div class="gt-field">
      <label>Hasta</label>
      <input type="date" id="inpTo"/>
    </div>
    <button class="gt-btn" id="btnConsult" disabled>Buscar Eventos</button>
  </div>

  <div id="gtResults">
    <div class="gt-empty">Selecciona vehículo y rango de fechas para consultar.</div>
  </div>

  <div id="gtLog" class="gt-log" style="display:none;"></div>
</div>

<script>
(function() {
    let api = null;
    let devices = [];

    function log(msg) {
        const el = document.getElementById('gtLog');
        el.style.display = 'block';
        el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        console.log('[CameraAddin]', msg);
    }

    function callApi(method, params) {
        return new Promise((resolve, reject) => {
            if (!api) return reject(new Error('API no inicializada'));
            api.call(method, params, resolve, reject);
        });
    }

    async function loadInitialData() {
        const today = new Date();
        const past = new Date();
        past.setDate(today.getDate() - 7);
        document.getElementById('inpTo').value = today.toISOString().split('T')[0];
        document.getElementById('inpFrom').value = past.toISOString().split('T')[0];

        // Cargar Lista de Vehículos
        devices = await callApi('Get', { typeName: 'Device', resultsLimit: 2000 });
        const devSel = document.getElementById('selDevice');
        devSel.innerHTML = '<option value="">Selecciona vehículo…</option>' +
            devices.map(d => `<option value="${d.id}">${d.name} (${d.serialNumber || d.id})</option>`).join('');

        document.getElementById('btnConsult').disabled = false;
    }

    async function executeQuery() {
        const deviceId = document.getElementById('selDevice').value;
        const eventTypeFilter = document.getElementById('selEventType').value;
        const fromVal = document.getElementById('inpFrom').value;
        const toVal = document.getElementById('inpTo').value;

        if (!deviceId || !fromVal || !toVal) {
            alert('Por favor selecciona vehículo y el rango de fechas.');
            return;
        }

        const selectedDevice = devices.find(d => d.id === deviceId);
        if (!selectedDevice) {
            alert('No se pudo encontrar la información del vehículo seleccionado.');
            return;
        }

        document.getElementById('gtResults').innerHTML = '<div class="gt-empty">Consultando CameraEvent y Viajes…</div>';
        const fromDate = fromVal + 'T00:00:00.000Z';
        const toDate = toVal + 'T23:59:59.999Z';

        try {
            log(`Consultando CameraEvent en rango [${fromDate} - ${toDate}]`);
            
            // 1. Consultar Viajes del vehículo y CameraEvent solo con rango de fechas
            const [trips, cameraEvents] = await Promise.all([
                callApi('Get', {
                    typeName: 'Trip',
                    search: { deviceSearch: { id: deviceId }, fromDate: fromDate, toDate: toDate },
                    resultsLimit: 5000
                }),
                callApi('Get', {
                    typeName: 'CameraEvent',
                    search: {
                        fromDate: fromDate,
                        toDate: toDate
                    }
                })
            ]);

            log(`Petición API con éxito. Eventos de cámara recibidos: ${cameraEvents.length}`);

            // 2. Filtrar en JS los eventos correspondientes al vehículo seleccionado (deviceId o deviceSerialNumber)
            const devEvents = cameraEvents.filter(e => 
                e.deviceId === deviceId || 
                (selectedDevice.serialNumber && e.deviceSerialNumber === selectedDevice.serialNumber)
            );

            // 3. Filtrar por tipo de evento si no es "ALL"
            const filteredEvents = eventTypeFilter === 'ALL'
                ? devEvents
                : devEvents.filter(e => e.eventType === eventTypeFilter);

            // 4. Cruzar viajes con los eventos filtrados
            const enrichedTrips = trips.map(t => {
                const tStart = new Date(t.start || t.startTime).getTime();
                const tStop = new Date(t.stop || t.stopTime).getTime();

                const tripEvents = filteredEvents.filter(ev => {
                    const evStart = new Date(ev.eventStart).getTime();
                    return evStart >= tStart && evStart <= tStop;
                });

                return { trip: t, events: tripEvents };
            });

            renderResults(enrichedTrips, filteredEvents, devEvents);
        } catch (e) {
            log('Error ejecutando consulta CameraEvent: ' + (e.message || JSON.stringify(e)));
            document.getElementById('gtResults').innerHTML = 
                `<div class="gt-empty" style="color:var(--danger)">Error: ${e.message || 'Error al consultar CameraEvent'}</div>`;
        }
    }

    function renderResults(enriched, filteredEvents, allDevEvents) {
        const tripsWithEvents = enriched.filter(e => e.events.length > 0).length;
        const totalTrips = enriched.length;

        const eventCounts = {};
        allDevEvents.forEach(e => {
            eventCounts[e.eventType] = (eventCounts[e.eventType] || 0) + 1;
        });

        let html = `
        <div class="gt-metrics">
            <div class="gt-card"><div class="lbl">Viajes Analizados</div><div class="val">${totalTrips}</div></div>
            <div class="gt-card"><div class="lbl">Viajes con Evento</div><div class="val" style="color:var(--danger);">${tripsWithEvents}</div></div>
            <div class="gt-card"><div class="lbl">Eventos Coincidentes</div><div class="val" style="color:var(--accent);">${filteredEvents.length}</div></div>
            <div class="gt-card"><div class="lbl">Total Eventos Vehículo</div><div class="val">${allDevEvents.length}</div></div>
        </div>

        <div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;">
            <strong>Tipos de Evento Detectados en este Vehículo:</strong>
            <ul style="margin:8px 0 0;padding-left:20px;font-size:12px;color:var(--ink);">`;

        const keys = Object.keys(eventCounts);
        if (keys.length === 0) {
            html += `<li>Ninguno en este periodo.</li>`;
        } else {
            keys.forEach(type => {
                html += `<li><strong>${type}</strong>: ${eventCounts[type]} detección(es)</li>`;
            });
        }

        html += `</ul></div>

        <div class="gt-table-container">
        <table>
        <thead>
            <tr>
                <th>Fecha / Hora Inicio</th>
                <th>Hora Fin</th>
                <th>Distancia</th>
                <th>Estado</th>
                <th>Detalle de Eventos</th>
            </tr>
        </thead>
        <tbody>`;

        if (enriched.length === 0) {
            html += `<tr><td colspan="5" style="text-align:center;padding:20px;">No se encontraron viajes en el periodo seleccionado.</td></tr>`;
        } else {
            enriched.sort((a,b) => new Date(b.trip.start || b.trip.startTime) - new Date(a.trip.start || a.trip.startTime));

            enriched.forEach(item => {
                const t = item.trip;
                const start = t.start || t.startTime;
                const stop = t.stop || t.stopTime;
                const dist = (t.distance || 0).toFixed(1);

                let eventsSummary = '—';
                if (item.events.length > 0) {
                    const counts = {};
                    item.events.forEach(ev => {
                        counts[ev.eventType] = (counts[ev.eventType] || 0) + 1;
                    });
                    eventsSummary = Object.entries(counts)
                        .map(([type, count]) => `<strong>${type}</strong> (${count})`)
                        .join(', ');
                }

                const badge = item.events.length > 0
                    ? `<span class="pill pill-danger">⚠️ ${item.events.length} evento(s)</span>`
                    : `<span class="pill pill-ok">✓ Sin incidencias</span>`;

                html += `<tr>
                    <td>${new Date(start).toLocaleString('es-ES')}</td>
                    <td>${new Date(stop).toLocaleString('es-ES')}</td>
                    <td>${dist} km</td>
                    <td>${badge}</td>
                    <td>${eventsSummary}</td>
                </tr>`;
            });
        }

        html += '</tbody></table></div>';
        document.getElementById('gtResults').innerHTML = html;
    }

    if (typeof geotab === 'undefined') {
        window.geotab = { addin: {} };
    }

    geotab.addin.testpasajerocamara = function() {
        return {
            initialize: function(geotabApi, geotabState, callback) {
                api = geotabApi;
                loadInitialData().catch(e => log('Error en inicialización: ' + e.message));
                document.getElementById('btnConsult').addEventListener('click', executeQuery);
                callback();
            },
            focus: function() {},
            blur: function() {}
        };
    };
})();
</script>
</body>
</html>
