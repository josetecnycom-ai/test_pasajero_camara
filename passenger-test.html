<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Control de Eventos de Cámara y Pasajeros</title>
</head>
<body style="margin:0;padding:0;background:transparent;">
<style>
  #gt-addin {
    --ink: #1e293b;
    --ink-light: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --surface: #f8fafc;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: var(--ink);
    padding: 20px;
    max-width: 1200px;
  }
  #gt-addin * { box-sizing: border-box; }
  
  .gt-header { margin-bottom: 20px; }
  .gt-header h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
  .gt-header p { margin: 0; color: var(--ink-light); font-size: 12px; }

  .gt-filter-bar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    background: #ffffff; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .gt-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
  .gt-field label { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.5px; }
  .gt-field select, .gt-field input {
    height: 36px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px; font-size: 13px; outline: none; background: #fff;
  }
  
  .gt-btn {
    height: 36px; padding: 0 20px; border-radius: 6px; border: none;
    background: var(--accent); color: #ffffff; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .gt-btn:hover { background: var(--accent-hover); }
  .gt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .gt-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .gt-card { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .gt-card .lbl { font-size: 11px; font-weight: 600; color: var(--ink-light); text-transform: uppercase; }
  .gt-card .val { font-size: 22px; font-weight: 700; margin-top: 4px; }

  .gt-table-container { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
  th { background: var(--surface); font-weight: 600; color: var(--ink-light); text-transform: uppercase; font-size: 10px; }
  
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .pill-ok { background: var(--ok-bg); color: var(--ok); }
  .pill-danger { background: var(--danger-bg); color: var(--danger); }
  
  .gt-empty { padding: 40px; text-align: center; color: var(--ink-light); }
  .gt-log { margin-top: 20px; padding: 12px; background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 11px; border-radius: 6px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
</style>

<div id="gt-addin">
  <div class="gt-header">
    <h1>Informe de Infracciones de Cámara y Pasajeros</h1>
    <p>Detección automática de reglas asociadas a eventos de excepción</p>
  </div>

  <div class="gt-filter-bar">
    <div class="gt-field">
      <label>Vehículo</label>
      <select id="selDevice"><option value="">Cargando vehículos…</option></select>
    </div>
    <div class="gt-field">
      <label>Desde</label>
      <input type="date" id="inpFrom"/>
    </div>
    <div class="gt-field">
      <label>Hasta</label>
      <input type="date" id="inpTo"/>
    </div>
    <button class="gt-btn" id="btnConsult" disabled>Analizar Infracciones</button>
  </div>

  <div id="gtResults">
    <div class="gt-empty">Selecciona vehículo y rango de fechas para consultar.</div>
  </div>

  <div id="gtLog" class="gt-log" style="display:none;"></div>
</div>

<script>
(function() {
    let api = null;
    let devices = [];
    let knownRules = new Map();

    function log(msg) {
        const el = document.getElementById('gtLog');
        el.style.display = 'block';
        el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        console.log('[PassengerAddin]', msg);
    }

    function callApi(method, params) {
        return new Promise((resolve, reject) => {
            if (!api) return reject(new Error('API no inicializada'));
            api.call(method, params, resolve, reject);
        });
    }

    async function loadInitialData() {
        const today = new Date();
        const past = new Date();
        past.setDate(today.getDate() - 7);
        document.getElementById('inpTo').value = today.toISOString().split('T')[0];
        document.getElementById('inpFrom').value = past.toISOString().split('T')[0];

        // Cargar Vehículos
        devices = await callApi('Get', { typeName: 'Device', resultsLimit: 2000 });
        const devSel = document.getElementById('selDevice');
        devSel.innerHTML = '<option value="">Selecciona vehículo…</option>' +
            devices.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

        document.getElementById('btnConsult').disabled = false;
    }

    async function resolveRuleNames(ruleIds) {
        const missingIds = ruleIds.filter(id => !knownRules.has(id));
        if (missingIds.length === 0) return;

        log(`Resolviendo nombres para ${missingIds.length} regla(s) detectada(s)…`);
        
        for (const id of missingIds) {
            try {
                const res = await callApi('Get', { typeName: 'Rule', search: { id: id } });
                if (res && res.length > 0 && res[0].name) {
                    knownRules.set(id, res[0].name);
                } else {
                    knownRules.set(id, `Regla del Sistema (${id})`);
                }
            } catch (e) {
                knownRules.set(id, `Regla (${id})`);
            }
        }
    }

    async function executeQuery() {
        const deviceId = document.getElementById('selDevice').value;
        const fromVal = document.getElementById('inpFrom').value;
        const toVal = document.getElementById('inpTo').value;

        if (!deviceId || !fromVal || !toVal) {
            alert('Por favor selecciona vehículo y ambas fechas.');
            return;
        }

        document.getElementById('gtResults').innerHTML = '<div class="gt-empty">Obteniendo viajes e infracciones de excepción…</div>';
        const fromDate = fromVal + 'T00:00:00.000Z';
        const toDate = toVal + 'T23:59:59.999Z';

        try {
            log(`Consultando vehículo ${deviceId} desde ${fromDate} hasta ${toDate}`);
            
            // 1. Obtener viajes y todas las excepciones
            const [trips, exceptions] = await Promise.all([
                callApi('Get', {
                    typeName: 'Trip',
                    search: { deviceSearch: { id: deviceId }, fromDate: fromDate, toDate: toDate },
                    resultsLimit: 5000
                }),
                callApi('Get', {
                    typeName: 'ExceptionEvent',
                    search: { deviceSearch: { id: deviceId }, fromDate: fromDate, toDate: toDate }
                })
            ]);

            log(`Petición finalizada: ${trips.length} viajes, ${exceptions.length} eventos de excepción encontrados.`);

            // 2. Extraer todos los IDs de regla únicos que realmente han generado eventos
            const uniqueRuleIds = [...new Set(exceptions.map(ex => ex.rule ? ex.rule.id : null).filter(Boolean))];
            log(`IDs de reglas únicos extraídos directamente de los eventos: [${uniqueRuleIds.join(', ')}]`);

            // 3. Resolver los nombres de esas reglas específicas
            await resolveRuleNames(uniqueRuleIds);

            // 4. Cruzar viajes con infracciones
            const enrichedTrips = trips.map(t => {
                const tStart = new Date(t.start || t.startTime).getTime();
                const tStop = new Date(t.stop || t.stopTime).getTime();

                const tripExceptions = exceptions.filter(ex => {
                    const exStart = new Date(ex.activeFrom).getTime();
                    return exStart >= tStart && exStart <= tStop;
                });

                return { trip: t, exceptions: tripExceptions };
            });

            renderResults(enrichedTrips, exceptions, uniqueRuleIds);
        } catch (e) {
            log('Error en consulta: ' + e.message);
            document.getElementById('gtResults').innerHTML = 
                `<div class="gt-empty" style="color:var(--danger)">Error: ${e.message}</div>`;
        }
    }

    function renderResults(enriched, allExceptions, uniqueRuleIds) {
        const tripsWithInfraction = enriched.filter(e => e.exceptions.length > 0).length;
        const totalTrips = enriched.length;

        let html = `
        <div class="gt-metrics">
            <div class="gt-card"><div class="lbl">Viajes Totales</div><div class="val">${totalTrips}</div></div>
            <div class="gt-card"><div class="lbl">Con Infracción</div><div class="val" style="color:var(--danger);">${tripsWithInfraction}</div></div>
            <div class="gt-card"><div class="lbl">Total Infracciones</div><div class="val" style="color:var(--accent);">${allExceptions.length}</div></div>
            <div class="gt-card"><div class="lbl">Tipos de Regla Detectados</div><div class="val">${uniqueRuleIds.length}</div></div>
        </div>

        <div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;">
            <strong>Desglose de Reglas Ocurridas en este Vehículo:</strong>
            <ul style="margin:8px 0 0;padding-left:20px;font-size:12px;color:var(--ink);">`;

        uniqueRuleIds.forEach(id => {
            const count = allExceptions.filter(e => e.rule && e.rule.id === id).length;
            const name = knownRules.get(id) || id;
            html += `<li><strong>${name}</strong> (ID: <code>${id}</code>) — <strong>${count}</strong> eventos</li>`;
        });

        html += `</ul></div>

        <div class="gt-table-container">
        <table>
        <thead>
            <tr>
                <th>Fecha / Hora Inicio</th>
                <th>Hora Fin</th>
                <th>Distancia</th>
                <th>Estado</th>
                <th>Detalle de Reglas Ocurridas</th>
            </tr>
        </thead>
        <tbody>`;

        if (enriched.length === 0) {
            html += `<tr><td colspan="5" style="text-align:center;padding:20px;">No se encontraron viajes en el periodo seleccionado.</td></tr>`;
        } else {
            enriched.sort((a,b) => new Date(b.trip.start || b.trip.startTime) - new Date(a.trip.start || a.trip.startTime));

            enriched.forEach(item => {
                const t = item.trip;
                const start = t.start || t.startTime;
                const stop = t.stop || t.stopTime;
                const dist = (t.distance || 0).toFixed(1);

                let rulesSummary = '—';
                if (item.exceptions.length > 0) {
                    const ruleCounts = {};
                    item.exceptions.forEach(ex => {
                        const rId = ex.rule ? ex.rule.id : 'desconocida';
                        const name = knownRules.get(rId) || rId;
                        ruleCounts[name] = (ruleCounts[name] || 0) + 1;
                    });
                    rulesSummary = Object.entries(ruleCounts)
                        .map(([rName, count]) => `<strong>${rName}</strong> (${count})`)
                        .join(', ');
                }

                const badge = item.exceptions.length > 0
                    ? `<span class="pill pill-danger">⚠️ ${item.exceptions.length} evento(s)</span>`
                    : `<span class="pill pill-ok">✓ Limpio</span>`;

                html += `<tr>
                    <td>${new Date(start).toLocaleString('es-ES')}</td>
                    <td>${new Date(stop).toLocaleString('es-ES')}</td>
                    <td>${dist} km</td>
                    <td>${badge}</td>
                    <td>${rulesSummary}</td>
                </tr>`;
            });
        }

        html += '</tbody></table></div>';
        document.getElementById('gtResults').innerHTML = html;
    }

    if (typeof geotab === 'undefined') {
        window.geotab = { addin: {} };
    }

    geotab.addin.testpasajerocamara = function() {
        return {
            initialize: function(geotabApi, geotabState, callback) {
                api = geotabApi;
                loadInitialData().catch(e => log('Error inicializando: ' + e.message));
                document.getElementById('btnConsult').addEventListener('click', executeQuery);
                callback();
            },
            focus: function() {},
            blur: function() {}
        };
    };
})();
</script>
</body>
</html>
