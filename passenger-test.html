<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Geotab Video REST API Test</title>
</head>
<body style="margin:0;padding:0;background:transparent;">
<style>
  #vapi-wrap {
    --ink:#1a1a2e; --ink-mid:#4a4a6a; --border:#e2e2ee; --accent:#3d5af1;
    --ok:#1a9e6e; --danger:#dc2626; --surface:#f7f7fb;
    font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:14px; color:var(--ink);
    padding:20px 24px; max-width:1100px;
  }
  #vapi-wrap * { box-sizing:border-box; }
  #vapi-wrap h1 { font-size:16px; margin:0 0 16px; }
  .vapi-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px;
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .vapi-field { display:flex; flex-direction:column; gap:4px; }
  .vapi-field label { font-size:11px; font-weight:600; color:var(--ink-mid); text-transform:uppercase; }
  .vapi-field select, .vapi-field input {
    height:32px; border:1px solid #c8c8e0; border-radius:6px; padding:0 8px; font-size:13px; min-width:180px;
  }
  .vapi-btn {
    height:32px; padding:0 16px; border-radius:6px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; font-weight:600; font-size:13px; cursor:pointer;
  }
  .vapi-btn:disabled { opacity:.5; cursor:not-allowed; }
  .vapi-summary { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .vapi-metric { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 16px; min-width:140px; }
  .vapi-metric .lbl { font-size:11px; color:var(--ink-mid); text-transform:uppercase; font-weight:600; }
  .vapi-metric .val { font-size:20px; font-weight:700; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 12px; text-align:left; font-size:12px; border-bottom:1px solid var(--border); }
  th { background:var(--surface); font-weight:700; text-transform:uppercase; font-size:10px; color:var(--ink-mid); }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill-ok { background:#e0f5ed; color:var(--ok); }
  .pill-danger { background:#fee2e2; color:var(--danger); }
  .vapi-link { color:var(--accent); text-decoration:none; font-weight:600; font-size:11px; cursor:pointer; }
  .vapi-state { padding:30px; text-align:center; color:var(--ink-mid); font-size:13px; }
  .vapi-log { font-family:monospace; font-size:11px; color:var(--ink-mid); white-space:pre-wrap;
    background:var(--surface); border-radius:6px; padding:10px; margin-top:10px; max-height:350px; overflow:auto; }
</style>

<div id="vapi-wrap">
  <h1>Diagnóstico: Geotab Video REST API Client</h1>

  <div class="vapi-bar">
    <div class="vapi-field">
      <label>Vehículo</label>
      <select id="vapiDevice"><option value="">Cargando vehículos…</option></select>
    </div>
    <div class="vapi-field">
      <label>Desde</label>
      <input type="date" id="vapiFrom"/>
    </div>
    <div class="vapi-field">
      <label>Hasta</label>
      <input type="date" id="vapiTo"/>
    </div>
    <button class="vapi-btn" id="vapiRun" disabled>Consultar Video API</button>
  </div>

  <div id="vapiResults">
    <div class="vapi-state">Selecciona vehículo y rango de fechas para iniciar el análisis REST.</div>
  </div>

  <div id="vapiLog" class="vapi-log" style="display:none;"></div>
  <button class="vapi-btn" id="vapiCopyLog" style="display:none;margin-top:8px;background:#fff;color:var(--accent);">Copiar log completo</button>
</div>

<script>
(function() {

    let api = null;
    let videoBaseUrl = 'https://video.geotab.com/api/v1'; // Endpoint base por defecto del servicio de vídeo
    let bearerToken = null;
    let devices = [];

    function log(msg) {
        const el = document.getElementById('vapiLog');
        el.style.display = 'block';
        document.getElementById('vapiCopyLog').style.display = 'inline-flex';
        el.textContent += msg + '\n';
        console.log('[VideoRestAPI]', msg);
    }

    function callMyGeotab(method, params) {
        return new Promise((resolve, reject) => {
            if (!api) return reject(new Error('API MyGeotab no inicializada'));
            api.call(method, params, resolve, reject);
        });
    }

    function getMyGeotabSession() {
        return new Promise((resolve, reject) => {
            api.getSession((session) => {
                if (session) resolve(session);
                else reject(new Error('No se pudo obtener la sesión activa de MyGeotab'));
            });
        });
    }

    // ── 1. Autenticación contra el Video REST API ────────────────────────
    async function authenticateVideoApi() {
        if (bearerToken) return bearerToken;

        log('Obteniendo credenciales de sesión de MyGeotab…');
        const session = await getMyGeotabSession();

        log(`Autenticando en Video REST API para usuario: ${session.userName} / DB: ${session.database}…`);

        const authPayload = {
            database: session.database,
            userName: session.userName,
            sessionId: session.sessionId,
            server: session.server || window.location.hostname
        };

        try {
            const res = await fetch(`${videoBaseUrl}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(authPayload)
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Error HTTP ${res.status}: ${errText}`);
            }

            const data = await res.json();
            bearerToken = data.token || data.accessToken || data.jwt;
            log('--> Autenticación en Video REST API EXITOSA.');
            return bearerToken;
        } catch (e) {
            log('--> Error autenticando en Video REST API: ' + e.message);
            throw e;
        }
    }

    // ── 2. Petición genérica REST con Bearer Token ───────────────────────
    async function fetchVideoApi(endpoint, queryParams = {}) {
        const token = await authenticateVideoApi();
        const url = new URL(`${videoBaseUrl}${endpoint}`);
        
        Object.keys(queryParams).forEach(k => {
            if (queryParams[k] !== undefined && queryParams[k] !== null) {
                url.searchParams.append(k, queryParams[k]);
            }
        });

        log(`GET ${url.toString()}`);

        const res = await fetch(url.toString(), {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/json'
            }
        });

        if (!res.ok) {
            const txt = await res.text();
            throw new Error(`Video API HTTP ${res.status}: ${txt}`);
        }

        return await res.json();
    }

    async function loadDevices() {
        devices = await callMyGeotab('Get', { typeName: 'Device', resultsLimit: 2000 });
        const sel = document.getElementById('vapiDevice');
        sel.innerHTML = '<option value="">Selecciona vehículo…</option>' +
            devices.map(d => `<option value="${d.id}">${d.name} (${d.serialNumber || 'Sin S/N'})</option>`).join('');
        document.getElementById('vapiRun').disabled = false;
    }

    function fmtDateTime(d) {
        return new Date(d).toLocaleString('es-ES', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    }

    async function runAnalysis() {
        const deviceId = document.getElementById('vapiDevice').value;
        const fromInput = document.getElementById('vapiFrom').value;
        const toInput = document.getElementById('vapiTo').value;

        if (!deviceId || !fromInput || !toInput) {
            alert('Selecciona vehículo y fechas.');
            return;
        }

        document.getElementById('vapiLog').textContent = '';
        document.getElementById('vapiResults').innerHTML = '<div class="vapi-state">Consultando Video REST API…</div>';

        const device = devices.find(d => d.id === deviceId);
        const fromDate = fromInput + 'T00:00:00.000Z';
        const toDate = toInput + 'T23:59:59.999Z';

        try {
            log(`=== CONSULTA REST VIDEO API PARA ${device.name} (${device.serialNumber}) ===`);
            
            // 1. Obtener viajes para contextualizar
            const trips = await callMyGeotab('Get', {
                typeName: 'Trip',
                search: { deviceSearch: { id: deviceId }, fromDate: fromDate, toDate: toDate }
            });
            log(`Viajes obtenidos: ${trips.length}`);

            // 2. Consulta de eventos a la API REST de Vídeo
            let cameraEvents = [];
            try {
                cameraEvents = await fetchVideoApi('/events', {
                    deviceSerialNumber: device.serialNumber,
                    fromDate: fromDate,
                    toDate: toDate
                });
                log(`Eventos devueltos por Video API: ${Array.isArray(cameraEvents) ? cameraEvents.length : 0}`);
            } catch (errApi) {
                log(`Aviso al consultar /events: ${errApi.message}`);
                // Intentar fallback endpoint alternativo
                try {
                    cameraEvents = await fetchVideoApi(`/devices/${device.serialNumber}/events`, {
                        fromDate: fromDate,
                        toDate: toDate
                    });
                } catch (err2) {
                    log(`Falló también endpoint alternativo: ${err2.message}`);
                }
            }

            renderResults(trips, Array.isArray(cameraEvents) ? cameraEvents : []);
        } catch (e) {
            log('ERROR GENERAL: ' + e.message);
            document.getElementById('vapiResults').innerHTML =
                `<div class="vapi-state" style="color:var(--danger);">Error: ${e.message}</div>`;
        }
    }

    function renderResults(trips, cameraEvents) {
        let html = `
        <div class="vapi-summary">
            <div class="vapi-metric"><div class="lbl">Viajes</div><div class="val">${trips.length}</div></div>
            <div class="vapi-metric"><div class="lbl">Eventos REST Vídeo</div><div class="val" style="color:var(--accent);">${cameraEvents.length}</div></div>
        </div>
        <table>
        <thead><tr>
            <th>Fecha</th><th>Inicio</th><th>Fin</th><th>Eventos Cámara Detectados</th><th>Acciones</th>
        </tr></thead><tbody>`;

        trips.sort((a,b) => new Date(b.start || b.startTime) - new Date(a.start || a.startTime));

        trips.forEach(t => {
            const start = t.start || t.startTime;
            const stop = t.stop || t.stopTime;
            const tStart = new Date(start).getTime();
            const tStop = new Date(stop).getTime();

            const evsInTrip = cameraEvents.filter(ev => {
                const evT = new Date(ev.timestamp || ev.dateTime || ev.eventStart).getTime();
                return evT >= tStart && evT <= tStop;
            });

            const typesList = evsInTrip.map(e => e.type || e.eventType || 'Evento').join(', ');
            const badge = evsInTrip.length > 0
                ? `<span class="pill pill-danger">🎥 ${evsInTrip.length} (${typesList})</span>`
                : `<span class="pill pill-ok">Sin eventos</span>`;

            html += `<tr>
                <td>${fmtDateTime(start).split(' ')[0]}</td>
                <td>${fmtDateTime(start)}</td>
                <td>${fmtDateTime(stop)}</td>
                <td>${badge}</td>
                <td>${evsInTrip.length > 0 ? `<span class="vapi-link" onclick="alert('ID Evento: ${evsInTrip[0].id}')">Ver detalle</span>` : '—'}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        document.getElementById('vapiResults').innerHTML = html;
    }

    // ── Registration ───────────────────────────────────────────────────
    if (typeof geotab === 'undefined') {
        window.geotab = { addin: {} };
    }

    geotab.addin.testpasajerocamara = function() {
        return {
            initialize: function(geotabApi, geotabState, callback) {
                api = geotabApi;
                loadDevices().catch(e => log('Error cargando lista de vehículos: ' + e.message));
                document.getElementById('vapiRun').addEventListener('click', runAnalysis);
                const copyBtn = document.getElementById('vapiCopyLog');
                copyBtn.addEventListener('click', () => {
                    const text = document.getElementById('vapiLog').textContent;
                    navigator.clipboard.writeText(text).then(() => {
                        copyBtn.textContent = '¡Copiado!';
                        setTimeout(() => { copyBtn.textContent = 'Copiar log completo'; }, 1500);
                    });
                });
                callback();
            },
            focus: function() {},
            blur: function() {}
        };
    };
})();
</script>
</body>
</html>
