<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Test Diagnóstico Eventos Cámara</title>
</head>
<body style="margin:0;padding:0;background:transparent;">
<style>
  #ptc-wrap {
    --ink:#1a1a2e; --ink-mid:#4a4a6a; --border:#e2e2ee; --accent:#3d5af1;
    --ok:#1a9e6e; --danger:#dc2626; --surface:#f7f7fb;
    font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:14px; color:var(--ink);
    padding:20px 24px; max-width:1100px;
  }
  #ptc-wrap * { box-sizing:border-box; }
  #ptc-wrap h1 { font-size:16px; margin:0 0 16px; }
  .ptc-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px;
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .ptc-field { display:flex; flex-direction:column; gap:4px; }
  .ptc-field label { font-size:11px; font-weight:600; color:var(--ink-mid); text-transform:uppercase; }
  .ptc-field select, .ptc-field input {
    height:32px; border:1px solid #c8c8e0; border-radius:6px; padding:0 8px; font-size:13px; min-width:180px;
  }
  .ptc-btn {
    height:32px; padding:0 16px; border-radius:6px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; font-weight:600; font-size:13px; cursor:pointer;
  }
  .ptc-btn:disabled { opacity:.5; cursor:not-allowed; }
  .ptc-summary { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .ptc-metric { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 16px; min-width:140px; }
  .ptc-metric .lbl { font-size:11px; color:var(--ink-mid); text-transform:uppercase; font-weight:600; }
  .ptc-metric .val { font-size:20px; font-weight:700; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 12px; text-align:left; font-size:12px; border-bottom:1px solid var(--border); }
  th { background:var(--surface); font-weight:700; text-transform:uppercase; font-size:10px; color:var(--ink-mid); }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill-ok { background:#e0f5ed; color:var(--ok); }
  .pill-danger { background:#fee2e2; color:var(--danger); }
  .ptc-link { color:var(--accent); text-decoration:none; font-weight:600; font-size:11px; }
  .ptc-state { padding:30px; text-align:center; color:var(--ink-mid); font-size:13px; }
  .ptc-log { font-family:monospace; font-size:11px; color:var(--ink-mid); white-space:pre-wrap;
    background:var(--surface); border-radius:6px; padding:10px; margin-top:10px; max-height:420px; overflow:auto; }
</style>

<div id="ptc-wrap">
  <h1>Test Diagnóstico: Eventos de Cámara y Reglas</h1>

  <div class="ptc-bar">
    <div class="ptc-field">
      <label>Vehículo</label>
      <select id="ptcDevice"><option value="">Cargando vehículos…</option></select>
    </div>
    <div class="ptc-field">
      <label>Desde</label>
      <input type="date" id="ptcFrom"/>
    </div>
    <div class="ptc-field">
      <label>Hasta</label>
      <input type="date" id="ptcTo"/>
    </div>
    <button class="ptc-btn" id="ptcRun" disabled>Analizar Todo</button>
  </div>

  <div id="ptcResults">
    <div class="ptc-state">Selecciona vehículo y rango de fechas para iniciar el análisis global.</div>
  </div>

  <div id="ptcLog" class="ptc-log" style="display:none;"></div>
  <button class="ptc-btn" id="ptcCopyLog" style="display:none;margin-top:8px;background:#fff;color:var(--accent);">Copiar log completo</button>
</div>

<script>
(function() {

    let api = null;
    let devices = [];

    function log(msg) {
        const el = document.getElementById('ptcLog');
        el.style.display = 'block';
        document.getElementById('ptcCopyLog').style.display = 'inline-flex';
        el.textContent += msg + '\n';
        console.log('[CameraTest]', msg);
    }

    function callApi(method, params) {
        return new Promise((resolve, reject) => {
            if (!api) return reject(new Error('API no inicializada'));
            api.call(method, params, resolve, reject);
        });
    }

    // ── Obtener datos de la entidad Camera ──────────────────────────────
    let _cameraCache = null;
    async function getCameraForDevice(deviceId) {
        if (!_cameraCache) {
            try {
                _cameraCache = await callApi('Get', { typeName: 'Camera' });
                log(`Camera: ${_cameraCache ? _cameraCache.length : 0} cámaras en total en la base de datos.`);
            } catch (e) {
                log('ERROR cargando lista de Camera: ' + e.message);
                _cameraCache = [];
            }
        }

        const device = devices.find(d => d.id === deviceId);
        if (!device || !device.serialNumber) {
            log(`AVISO: No se encontró serialNumber para ${deviceId}.`);
            return null;
        }

        const devSerialClean = device.serialNumber.trim().toUpperCase();

        const match = _cameraCache.find(c => 
            (c.deviceSerialNumber && c.deviceSerialNumber.trim().toUpperCase() === devSerialClean) ||
            (c.device && c.device.id === deviceId)
        );

        if (!match) {
            log(`AVISO: No se encontró registro en Camera para el GO con S/N ${device.serialNumber}.`);
            return null;
        }

        log(`Cámara mapeada: ID=${match.id}, Serial=${match.cameraSerialNumber}, Dispositivo=${match.deviceSerialNumber}`);
        return match;
    }

    // ── Consulta multicriterio de CameraEvent sin filtrar por tipo ─────
    async function getAllCameraEvents(deviceId, fromDate, toDate) {
        const cameraObj = await getCameraForDevice(deviceId);

        const strategies = [
            { 
                name: 'Sin filtros de cámara (solo rango de fechas global)', 
                search: { fromDate: fromDate, toDate: toDate } 
            },
            { 
                name: 'deviceSearch en CameraEvent', 
                search: { deviceSearch: { id: deviceId }, fromDate: fromDate, toDate: toDate } 
            }
        ];

        if (cameraObj) {
            strategies.unshift(
                { 
                    name: 'cameraSearch por objeto ID', 
                    search: { cameraSearch: { id: cameraObj.id }, fromDate: fromDate, toDate: toDate } 
                },
                { 
                    name: 'cameraSearch por serialNumber', 
                    search: { cameraSearch: { serialNumber: cameraObj.cameraSerialNumber }, fromDate: fromDate, toDate: toDate } 
                }
            );
        }

        let rawEvents = [];
        let successStrat = null;

        for (const strat of strategies) {
            try {
                log(`Probando consulta CameraEvent [${strat.name}]…`);
                const res = await callApi('Get', { typeName: 'CameraEvent', search: strat.search });
                log(`--> ÉXITO [${strat.name}]: ${res ? res.length : 0} eventos devueltos.`);
                rawEvents = res || [];
                successStrat = strat.name;
                break;
            } catch (e) {
                log(`--> ERROR [${strat.name}]: ${e.message}`);
            }
        }

        return { rawEvents, successStrat };
    }

    // ── Consulta secundaria en ExceptionEvent (Reglas de Geotab) ────────
    async function getExceptionEvents(deviceId, fromDate, toDate) {
        try {
            log(`Consultando ExceptionEvent (reglas de infracción) para ${deviceId}…`);
            const exceptions = await callApi('Get', {
                typeName: 'ExceptionEvent',
                search: {
                    deviceSearch: { id: deviceId },
                    fromDate: fromDate,
                    toDate: toDate
                }
            });
            log(`ExceptionEvent: ${exceptions ? exceptions.length : 0} eventos de regla encontrados.`);
            return exceptions || [];
        } catch (e) {
            log(`ERROR consultando ExceptionEvent: ${e.message}`);
            return [];
        }
    }

    async function getTrips(deviceId, fromDate, toDate) {
        return await callApi('Get', {
            typeName: 'Trip',
            search: { deviceSearch: { id: deviceId }, fromDate: fromDate, toDate: toDate },
            resultsLimit: 5000
        });
    }

    async function loadDevices() {
        const list = await callApi('Get', { typeName: 'Device', resultsLimit: 2000 });
        devices = list;
        const sel = document.getElementById('ptcDevice');
        sel.innerHTML = '<option value="">Selecciona…</option>' +
            list.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
        document.getElementById('ptcRun').disabled = false;
    }

    function fmtDateTime(d) {
        return new Date(d).toLocaleString('es-ES', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    }

    async function viewEvidence(eventId) {
        try {
            const result = await callApi('Get', { 
                typeName: 'CameraEventRecording', 
                search: { 
                    eventId: [eventId],
                    includeUnblurred: true 
                } 
            });
            const rec = Array.isArray(result) ? result[0] : result;
            const url = rec && (rec.mediaUrls ? (Array.isArray(rec.mediaUrls) ? rec.mediaUrls[0] : rec.mediaUrls) : rec.fileDownloadUrl);
            
            if (url) {
                window.open(url, '_blank');
            } else {
                alert('Grabación no disponible para este evento.');
            }
        } catch (e) {
            alert('Error en grabación: ' + e.message);
        }
    }
    window.ptcViewEvidence = viewEvidence;

    async function runComparison() {
        const deviceId = document.getElementById('ptcDevice').value;
        const fromInput = document.getElementById('ptcFrom').value;
        const toInput = document.getElementById('ptcTo').value;
        if (!deviceId || !fromInput || !toInput) {
            alert('Selecciona vehículo y ambas fechas.');
            return;
        }

        document.getElementById('ptcLog').textContent = '';
        document.getElementById('ptcResults').innerHTML = '<div class="ptc-state">Analizando registros de cámara y reglas…</div>';

        const fromDate = fromInput + 'T00:00:00.000Z';
        const toDate = toInput + 'T23:59:59.999Z';

        try {
            log(`=== INICIO DIAGNÓSTICO PARA VEHÍCULO ${deviceId} ===`);
            const trips = await getTrips(deviceId, fromDate, toDate);
            log(`Viajes (Trips) recuperados: ${trips.length}`);

            // 1. Petición amplia de CameraEvent
            const { rawEvents, successStrat } = await getAllCameraEvents(deviceId, fromDate, toDate);

            // Filtrar eventos pertenecientes al vehículo si la búsqueda devolvió globales
            const deviceCamEvents = rawEvents.filter(ev => !ev.deviceId || ev.deviceId === deviceId);

            // Extraer tipos de eventos únicos encontrados
            const eventTypesFound = [...new Set(deviceCamEvents.map(ev => ev.eventType || 'Sin eventType'))];
            log(`Tipos de evento de cámara distintos detectados: [${eventTypesFound.join(', ')}]`);

            if (deviceCamEvents.length > 0) {
                log('Muestra del primer CameraEvent recibido:');
                log(JSON.stringify(deviceCamEvents[0], null, 2));
            }

            // 2. Consulta paralela de ExceptionEvents
            const exceptions = await getExceptionEvents(deviceId, fromDate, toDate);

            renderResults(trips, deviceCamEvents, exceptions, eventTypesFound, successStrat);
        } catch (e) {
            log('ERROR GENERAL: ' + e.message);
            document.getElementById('ptcResults').innerHTML =
                `<div class="ptc-state" style="color:var(--danger);">Error: ${e.message}</div>`;
        }
    }

    function renderResults(trips, camEvents, exceptions, eventTypesFound, successStrat) {
        let html = `
        <div class="ptc-summary">
            <div class="ptc-metric"><div class="lbl">Viajes</div><div class="val">${trips.length}</div></div>
            <div class="ptc-metric"><div class="lbl">Eventos Cámara</div><div class="val" style="color:var(--accent);">${camEvents.length}</div></div>
            <div class="ptc-metric"><div class="lbl">Reglas (ExceptionEvent)</div><div class="val" style="color:var(--ok);">${exceptions.length}</div></div>
        </div>
        <div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;">
            <strong>Diagnóstico de API:</strong><br>
            • Método funcional de CameraEvent: <code>${successStrat || 'Ninguno (Error de API)'}</code><br>
            • Tipos de eventos hallados: <code>${eventTypesFound.length ? eventTypesFound.join(', ') : 'Ninguno'}</code>
        </div>
        <table>
        <thead><tr>
            <th>Fecha</th><th>Inicio</th><th>Fin</th><th>Eventos Cámara Detectados</th><th>Evidencia</th>
        </tr></thead><tbody>`;

        trips.sort((a,b) => new Date(b.start || b.startTime) - new Date(a.start || a.startTime));

        trips.forEach(t => {
            const start = t.start || t.startTime;
            const stop = t.stop || t.stopTime;
            const tStart = new Date(start).getTime();
            const tStop = new Date(stop).getTime();

            const evsInTrip = camEvents.filter(ev => {
                const evT = new Date(ev.eventStart || ev.dateTime).getTime();
                return evT >= tStart && evT <= tStop;
            });

            const typesList = evsInTrip.map(e => e.eventType).join(', ');
            const badge = evsInTrip.length > 0
                ? `<span class="pill pill-danger">🎥 ${evsInTrip.length} (${typesList})</span>`
                : `<span class="pill pill-ok">Sin eventos</span>`;

            const link = evsInTrip.length > 0
                ? `<a href="#" class="ptc-link" onclick="event.preventDefault();ptcViewEvidence('${evsInTrip[0].id}')">Ver grabación</a>`
                : '';

            html += `<tr>
                <td>${fmtDateTime(start).split(' ')[0]}</td>
                <td>${fmtDateTime(start)}</td>
                <td>${fmtDateTime(stop)}</td>
                <td>${badge}</td>
                <td>${link}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        document.getElementById('ptcResults').innerHTML = html;
    }

    // ── Registro del Add-in ───────────────────────────────────────────
    if (typeof geotab === 'undefined') {
        window.geotab = { addin: {} };
    }

    geotab.addin.testpasajerocamara = function() {
        return {
            initialize: function(geotabApi, geotabState, callback) {
                api = geotabApi;
                loadDevices().catch(e => log('ERROR cargando vehículos: ' + e.message));
                document.getElementById('ptcRun').addEventListener('click', runComparison);
                const copyBtn = document.getElementById('ptcCopyLog');
                copyBtn.addEventListener('click', () => {
                    const text = document.getElementById('ptcLog').textContent;
                    navigator.clipboard.writeText(text).then(() => {
                        copyBtn.textContent = '¡Copiado!';
                        setTimeout(() => { copyBtn.textContent = 'Copiar log completo'; }, 1500);
                    });
                });
                callback();
            },
            focus: function() {},
            blur: function() {}
        };
    };
})();
</script>
</body>
</html>
